name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Page editor, Slides, Board, Sheet, Charts, AI and MCP, App shell, Install or update]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Steps to reproduce help most. Attach the smallest Markdown file that shows the problem.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Folio version and operating system
      placeholder: 1.1.0 on Windows 11
