version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      editor:
        patterns: ['@tiptap/*', '@codemirror/*', '@lezer/*']
      build:
        patterns: ['electron', 'electron-builder', 'esbuild']
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
