name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (formats, MCP, UI smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install a virtual display for the UI smoke test
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a npm test
      - name: Attribution is intact (AGPL-3.0 section 7(b))
        run: |
          grep -q "Based on Folio by Gabriele Vaudano" NOTICE
          grep -q "Based on Folio by Gabriele Vaudano" README.md
          grep -q "Based on Folio by Gabriele Vaudano" src/main/main.js
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE

  package:
    name: Package ${{ matrix.os }}
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never
      - name: Build macOS
        if: runner.os == 'macOS'
        run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ runner.os }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          retention-days: 14
          if-no-files-found: error
