name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (formats, MCP, UI smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install a virtual display for the UI smoke test
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a npm test
      - name: Attribution is intact (AGPL-3.0 section 7(b))
        run: |
          grep -q "Based on Folio by Gabriele Vaudano" NOTICE
          grep -q "Based on Folio by Gabriele Vaudano" README.md
          grep -q "Based on Folio by Gabriele Vaudano" src/main/main.js
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE

  package:
    name: Package ${{ matrix.os }}
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Windows
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never
      - name: Build macOS
        if: runner.os == 'macOS'
        run: npm run dist:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Packaged app answers MCP over stdio, fuses are as intended
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="release/win-unpacked/Folio.exe"; else BIN=$(find release -path '*Folio.app/Contents/MacOS/Folio' | head -n 1); fi
          test -f "$BIN" || { echo "packaged binary not found"; ls -R release | head -40; exit 1; }
          npx --yes @electron/fuses read --app "$BIN" | tee fuses.txt
          if [ "$RUNNER_OS" = "Windows" ]; then grep -E "RunAsNode is Enabled" fuses.txt; export FOLIO_NODE_MODE=1; else grep -E "RunAsNode is Disabled" fuses.txt; fi
          grep -E "EnableNodeOptionsEnvironmentVariable is Disabled" fuses.txt
          grep -E "OnlyLoadAppFromAsar is Enabled" fuses.txt
          LEGACY=$(find release -path '*app.asar.unpacked/dist/mcp-stdio.mjs' | head -n 1)
          test -f "$LEGACY" || { echo "unpacked bridge not found"; exit 1; }
          FOLIO_DEBUG_STDIO=1 FOLIO_BINARY="$BIN" FOLIO_LEGACY_SCRIPT="$LEGACY" node test/stdio-binary.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ runner.os }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          retention-days: 14
          if-no-files-found: error
