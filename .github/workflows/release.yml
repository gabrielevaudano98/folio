name: Release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build macOS (universal .dmg and .zip)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Without signing secrets the variables are empty strings, which electron-builder
          # reads as a path (the project folder). Unset them and sign ad hoc instead.
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npm run dist:mac -- --publish never -c.mac.identity=-
          else
            npm run dist:mac -- --publish never
          fi
        env:
          # Optional secrets to sign and notarize. Without them the app is ad-hoc signed.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build Windows (installers x64 and arm64, portable)
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never
      - name: Build Linux (AppImage)
        if: runner.os == 'Linux'
        run: npm run dist:linux -- --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: folio-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true
      - run: ls -la dist-all
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          Pre-alpha builds. Windows: `Folio-Setup-*.exe` (installer) or `Folio-Portable-*.exe` (no install). Linux: `Folio-*.AppImage` (`chmod +x`, then run). macOS: open the universal `.dmg` (Apple silicon and Intel).
          These builds are not code-signed yet, so Windows SmartScreen / Smart App Control and macOS Gatekeeper may warn.
          Updates: the Windows installer updates itself from these releases (Settings → Updates). On macOS, Linux and the Windows portable exe Folio tells you when a new version is out; download it here.
          NOTES
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Republishing a version (workflow_dispatch, or a later package.json change that kept the version):
            # replace the assets, keep the release and its notes.
            gh release upload "v$VERSION" dist-all/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$VERSION" dist-all/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Folio $VERSION (pre-alpha)" --prerelease \
              --notes-file notes.md --generate-notes
          fi
